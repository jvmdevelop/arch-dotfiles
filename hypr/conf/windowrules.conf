# https://wiki.hypr.land/Configuring/Window-Rules/

windowrule {
    name       = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name             = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false

    no_focus = true
}

windowrule {
    name        = telegram-rule
    match:class = telegram-desktop
    match:float = true
}

windowrule {
    name        = move-hyprland-run
    match:class = hyprland-run

    move  = 20 monitor_h-120
    float = yes
}

windowrule {
    name        = kitty-float-size
    match:class = kitty
    match:float = true

    size = 900 600
}
