# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout  = us, ru
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}
