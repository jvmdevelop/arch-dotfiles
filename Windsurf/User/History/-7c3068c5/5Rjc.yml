version: '3.8'

services:
  sentence-transformer:
    build: ./sentence_transformer
    container_name: legis-sentence-transformer
    ports:
      - "5000:5000"
    volumes:
      - ./models:/cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  cross-encoder:
    build: ./cross_encoder
    container_name: legis-cross-encoder
    ports:
      - "5001:5000"
    volumes:
      - ./models:/cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  default:
    name: legis-ml-network
