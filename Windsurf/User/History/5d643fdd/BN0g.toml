[package]
name = "sb-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }
thiserror = "1.0"
anyhow = "1.0"
home = "0.5"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
urlencoding = "2.1"
