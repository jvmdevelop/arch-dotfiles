[package]
name = "legis-entropy"
version = "0.1.0"
edition = "2021"
description = "AI-powered legal analysis system for detecting contradictions in legislative documents"
authors = ["jdev team"]
license = "MIT"
repository = "https://github.com/jvmdevelop/legis-entropy"
keywords = ["legal", "analysis", "similarity", "documents", "ml"]
categories = ["text-processing", "science"]

[lib]
name = "legis_entropy"
path = "src/lib.rs"

[[bin]]
name = "legis-entropy"
path = "src/main.rs"

[dependencies]
# Web and HTTP
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time and utilities
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15"

# Text processing
regex = "1.10"
unicode-segmentation = "1.11"

# Math and linear algebra
ndarray = "0.15"
rand = "0.8"
