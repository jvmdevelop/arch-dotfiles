[package]
name = "legis-entropy"
version = "0.1.0"
edition = "2021"
description = "AI-powered legal analysis system for detecting contradictions in legislative documents"
authors = ["jdev team"]
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
hf-hub = "0.3"
tokio = { version = "1", features = ["full"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15"
