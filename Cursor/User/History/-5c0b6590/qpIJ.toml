[workspace]
resolver = "2"
members = [
  "crates/le-common",
  "crates/le-proto",
  "crates/le-storage",
  "services/nlp-service",
  "services/embedding-service",
  "services/classification-service",
  "services/conflict-service",
  "services/similarity-service",
  "services/analysis-service",
  "services/graph-service",
  "services/web-ui",
]

exclude = ["ml"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/jvmdevelop/legis-entropy"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
config = "0.14"
dotenvy = "0.15"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
once_cell = "1"
prost = "0.13"
prost-types = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.12", features = ["gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

axum = { version = "0.7", features = ["macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
pgvector = { version = "0.4", features = ["sqlx"] }

