syntax = "proto3";

package le.v1;

import "google/protobuf/timestamp.proto";

message TextDocument {
  string id = 1;
  string language = 2; // "ru" | "kk" | "auto"
  string text = 3;
}

message DocumentMetadata {
  string source = 1;
  string title = 2;
  string document_number = 3;
}

message VersionInfo {
  string version = 1;
  google.protobuf.Timestamp effective_from = 2;
  google.protobuf.Timestamp effective_to = 3;
}

message Document {
  string id = 1;
  DocumentMetadata meta = 2;
  VersionInfo version = 3;
  string language = 4;
  string raw_text = 5;
  string normalized_text = 6;
  google.protobuf.Timestamp ingested_at = 7;
}

message ConfidenceScore {
  float value = 1; 
}

message DateRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message Token {
  string text = 1;
  uint32 start = 2; // byte offset
  uint32 end = 3;   // byte offset (exclusive)
}

message Sentence {
  uint32 index = 1;
  uint32 start = 2;
  uint32 end = 3;
  string text = 4;
}

message StructuralElement {
  string kind = 1; // "article" | "part" | "point" | ...
  string label = 2; // e.g. "Статья 12" / "п. 3"
  uint32 start = 3;
  uint32 end = 4;
}

message NamedEntity {
  string kind = 1;   // "legal_term" | "date" | "amount" | "npa_ref" | ...
  string text = 2;
  uint32 start = 3;
  uint32 end = 4;
}

message NormalizeRequest {
  TextDocument doc = 1;
}

message NormalizeResponse {
  string normalized_text = 1;
}

message TokenizeRequest {
  TextDocument doc = 1;
}

message TokenizeResponse {
  repeated Token tokens = 1;
  repeated Sentence sentences = 2;
  repeated StructuralElement structure = 3;
}

message LemmatizeRequest {
  TextDocument doc = 1;
}

message LemmatizeResponse {
  repeated string lemmas = 1;
}

message NerRequest {
  TextDocument doc = 1;
}

message NerResponse {
  repeated NamedEntity entities = 1;
}

service NlpService {
  rpc Normalize(NormalizeRequest) returns (NormalizeResponse);
  rpc Tokenize(TokenizeRequest) returns (TokenizeResponse);
  rpc Lemmatize(LemmatizeRequest) returns (LemmatizeResponse);
  rpc Ner(NerRequest) returns (NerResponse);
}

// ---- Embeddings ----

message EmbedRequest {
  repeated TextDocument docs = 1;
  bool use_cache = 2;
}

message EmbeddingVector {
  // 768 float values for BERT-like models.
  repeated float values = 1;
}

message EmbedResponse {
  repeated EmbeddingVector embeddings = 1;
}

service EmbeddingService {
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}

// ---- Classification ----

enum NormType {
  NORM_TYPE_UNSPECIFIED = 0;
  NORM_TYPE_IMPERATIVE = 1;
  NORM_TYPE_DISPOSITIVE = 2;
  NORM_TYPE_DECLARATIVE = 3;
}

message ClassificationLabel {
  string label = 1;
  ConfidenceScore confidence = 2;
}

message ClassifyRequest {
  TextDocument doc = 1;
}

message ClassifyResponse {
  NormType norm_type = 1;
  ConfidenceScore norm_type_confidence = 2;
  repeated ClassificationLabel regulation_domains = 3;
  ClassificationLabel document_level = 4;
}

service ClassificationService {
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);
}

// ---- Conflict detection ----

message ConflictFeatures {
  // Higher-level signals used for explanation.
  float temporal_overlap = 1;
  float hierarchy_conflict = 2;
  float semantic_similarity = 3;
}

message DetectConflictRequest {
  TextDocument a = 1;
  TextDocument b = 2;
}

message DetectConflictResponse {
  bool conflict = 1;
  ConfidenceScore confidence = 2;
  ConflictFeatures features = 3;
  string explanation = 4;
}

service ConflictService {
  rpc Detect(DetectConflictRequest) returns (DetectConflictResponse);
}

// ---- Similarity ----

message SimilarityRequest {
  TextDocument query = 1;
  uint32 top_k = 2;
}

message SimilarityHit {
  string doc_id = 1;
  float score = 2; // cosine similarity
}

message SimilarityResponse {
  repeated SimilarityHit hits = 1;
}

service SimilarityService {
  rpc Search(SimilarityRequest) returns (SimilarityResponse);
}

// ---- Analysis & Graph API ----

message Norm {
  string id = 1;
  string document_id = 2;
  string path = 3; // e.g. "article:12/point:3/sent:2"
  uint32 start = 4;
  uint32 end = 5;
  string text = 6;
}

enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_REFERENCE = 1;
  EDGE_KIND_SIMILARITY = 2;
  EDGE_KIND_CONFLICT = 3;
  EDGE_KIND_DUPLICATE = 4;
  EDGE_KIND_OUTDATED = 5;
  EDGE_KIND_AMENDS = 6;
  EDGE_KIND_REPEALS = 7;
}

message Edge {
  string id = 1;
  string from_norm_id = 2;
  string to_norm_id = 3;
  EdgeKind kind = 4;
  float score = 5;
  string meta_json = 6;
}

enum FindingKind {
  FINDING_KIND_UNSPECIFIED = 0;
  FINDING_KIND_CONFLICT = 1;
  FINDING_KIND_DUPLICATE = 2;
  FINDING_KIND_OUTDATED = 3;
}

message TokenImportance {
  uint32 start = 1;
  uint32 end = 2;
  float importance = 3;
}

message Explanation {
  string summary = 1;
  ConflictFeatures features = 2;
  repeated TokenImportance token_importance = 3;
  string raw_json = 4;
}

message Finding {
  string id = 1;
  string norm_id = 2;
  FindingKind kind = 3;
  ConfidenceScore confidence = 4;
  string related_norm_id = 5; // optional
  Explanation explanation = 6;
  google.protobuf.Timestamp created_at = 7;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
}

message Job {
  string id = 1;
  string document_id = 2;
  JobStatus status = 3;
  string error = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message UploadDocumentRequest {
  DocumentMetadata meta = 1;
  VersionInfo version = 2;
  string language = 3;
  string raw_text = 4;
}

message UploadDocumentResponse {
  string document_id = 1;
}

message RunAnalysisRequest {
  string document_id = 1;
}

message RunAnalysisResponse {
  string job_id = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message GetFindingsRequest {
  string document_id = 1;
  float min_confidence = 2;
}

message GetFindingsResponse {
  repeated Finding findings = 1;
}

service AnalysisService {
  rpc UploadDocument(UploadDocumentRequest) returns (UploadDocumentResponse);
  rpc RunAnalysis(RunAnalysisRequest) returns (RunAnalysisResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc GetFindings(GetFindingsRequest) returns (GetFindingsResponse);
}

message GraphRequest {
  string document_id = 1;
  float min_score = 2;
  repeated EdgeKind kinds = 3;
}

message GraphResponse {
  repeated Norm norms = 1;
  repeated Edge edges = 2;
}

message GetNormRequest {
  string norm_id = 1;
}

message GetNormResponse {
  Norm norm = 1;
  repeated Finding findings = 2;
  repeated Edge edges = 3;
}

service GraphService {
  rpc GetGraph(GraphRequest) returns (GraphResponse);
  rpc GetNorm(GetNormRequest) returns (GetNormResponse);
}

